# 所有 API 密钥、端点、模型名称从 .env 读取，此处仅保留算法参数

embedding:
  dimension: 1024

vector_store:
  type: "faiss"
  persist_directory: "/data/faiss"

text_splitter:
  chunk_size: 250
  chunk_overlap: 50
  separators: ["\n\n", "\n", "。", "！", "？", "，", " ", ""]

retriever:
  bm25_weight: 0.3
  vector_weight: 0.7
  top_k: 5
  score_threshold: 0.0
  rrf_k: 60

reranker:
  model_name: "BAAI/bge-reranker-large"
  top_n: 3
  enabled: false

ocr:
  use_rapid_ocr: true
  ocr_lang: "ch"

storage:
  bucket: "knowledge-base"
  temp_dir: "/tmp/rag-service"

llm:
  temperature: 0.7
