syntax = "proto3";

package com.mykb.proto;
option java_package = "com.mykb.proto.common";

// ==================== Enums ====================

enum KBType {
  FAISS = 0;
  MILVUS = 1;
  CHROMA = 2;
}

enum EmbedModel {
  BGE_M3 = 0;
  BGE_LARGE = 1;
  TEXT_EMBEDDING_3_SMALL = 2;
}

enum FileStatus {
  UPLOADED = 0;
  PARSING = 1;
  CHUNKING = 2;
  EMBEDDING = 3;
  COMPLETED = 4;
  FAILED = 5;
}

// ==================== Shared Messages ====================

message PageRequest {
  int32 page = 1;
  int32 page_size = 2;
}

message PageInfo {
  int32 total = 1;
  int32 page = 2;
  int32 page_size = 3;
}

message StatusResponse {
  bool success = 1;
  string message = 2;
}

message ChunkInfo {
  string chunk_id = 1;
  string text = 2;
  int32 index = 3;
  string file_id = 4;
  float score = 5;
}

message SourceDoc {
  string file_name = 1;
  string file_ext = 2;
  string chunk_text = 3;
  int32 chunk_index = 4;
  float score = 5;
}
