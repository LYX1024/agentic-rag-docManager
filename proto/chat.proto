syntax = "proto3";

package com.mykb.proto;
option java_package = "com.mykb.proto.chat";

import "common.proto";

// ==================== Chat Service ====================

service ChatService {
  rpc RagChat(RagChatRequest) returns (stream RagChatChunk);
  rpc GetChatHistory(GetChatHistoryRequest) returns (GetChatHistoryResponse);
  rpc ListChatSessions(ListChatSessionsRequest) returns (ListChatSessionsResponse);
  rpc DeleteChatSession(DeleteChatSessionRequest) returns (StatusResponse);
}

// ==================== Messages ====================

message ChatMessage {
  string role = 1;       // "user" | "assistant" | "system"
  string content = 2;
}

message RagChatRequest {
  string query = 1;
  int64 kb_id = 2;
  string kb_name = 3;
  repeated ChatMessage history = 4;
  int32 top_k = 5;
  float score_threshold = 6;
  string session_id = 7;
  string llm_model = 8;
  float temperature = 9;
}

message RagChatChunk {
  string token = 1;
  bool finished = 2;
  repeated SourceDoc sources = 3;
  string message_id = 4;
  string session_id = 5;
}

message GetChatHistoryRequest {
  string session_id = 1;
  int32 limit = 2;
}

message ChatHistoryRecord {
  string id = 1;
  string role = 2;
  string content = 3;
  repeated SourceDoc sources = 4;
  string created_at = 5;
}

message GetChatHistoryResponse {
  repeated ChatHistoryRecord messages = 1;
  string session_id = 2;
  string title = 3;
}

message ListChatSessionsRequest {
  int64 user_id = 1;
  int64 kb_id = 2;
}

message ChatSessionInfo {
  string id = 1;
  string title = 2;
  int32 message_count = 3;
  string created_at = 4;
  string updated_at = 5;
}

message ListChatSessionsResponse {
  repeated ChatSessionInfo sessions = 1;
}

message DeleteChatSessionRequest {
  string session_id = 1;
}
